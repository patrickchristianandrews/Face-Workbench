name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: python build_desktop.py

      - name: Package release folder
        shell: pwsh
        run: |
          $src = "dist\FaceWorkbench"
          if (-not (Test-Path $src)) { throw "Build output missing: $src" }
          if (Test-Path "models") {
            New-Item -ItemType Directory -Force -Path "$src\models" | Out-Null
            Copy-Item -Recurse -Force "models\*" "$src\models\"
          }
          Compress-Archive -Path "$src\*" -DestinationPath "FaceWorkbench-Windows.zip" -Force
          Get-ChildItem FaceWorkbench-Windows.zip

      - name: Upload EXE zip
        uses: actions/upload-artifact@v4
        with:
          name: FaceWorkbench-Windows
          path: FaceWorkbench-Windows.zip
          retention-days: 30

      - name: Upload raw dist folder
        uses: actions/upload-artifact@v4
        with:
          name: FaceWorkbench-dist
          path: dist/FaceWorkbench/
          retention-days: 14
